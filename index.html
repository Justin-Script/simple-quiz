<!--
============================================================
    DEVELOPING SIMPLE QUIZ 
    OBJECT for data
    CLASSLIST for modal
============================================================
-->


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./quiz.js"></script>

</head>

<body>

  <section>
    <button class="b-eas" id="easy">Easy</button>
    <button class="b-norm" id="normal">Normal</button>
    <button class="b-hard" id="hard">Hard</button>
  </section>

  <div class="modal-eas hidden-eas" id="modal">

    <div class="p-cont-eas">

      <div class="header-eas">
        <div id="levelTitle"></div>
        <div id="displayScore">Score :</div>
        <p id="closeBtn">X</p>
      </div>

      <div class="p-content-eas">

        <p id="displayQuestion"></p>

        <p id="displayOptionsA"></p>
        <p id="displayOptionsB"></p>
        <p id="displayOptionsC"></p>
        <p id="displayOptionsD"></p>

        <div class="inputAnswer">

          <label>
            Answer:
            <input type="text" id="answerEas">
          </label>

          <button id="submitBtn">Submit</button>

          <button id="nextBtn">Next</button>

        </div>

        <p id="displayAnswer"></p>

      </div>

    </div>

  </div>


  <!-- Quiz behavior is loaded from quiz.js as an ES module. -->
  <script type="application/disabled">

    let questions = [];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    // --------------------
    // MODAL
    // --------------------

    const modal = document.getElementById("modal");

    document.getElementById("easy").addEventListener("click", () => {
      startQuiz('Easy', easyQuestions);
    });

    document.getElementById('normal').addEventListener('click', () => {
      startQuiz('Normal', normalQuestions);
    });

    document.getElementById('hard').addEventListener('click', () => {
      startQuiz('Hard', hardQuestions);
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      modal.classList.add("hidden-eas");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.add("hidden-eas");
      }
    });


    function startQuiz(level, questionSet) {

      questions = questionSet;
      currentQuestion = 0;
      score = 0;
      answered = false;

      document.getElementById('levelTitle').innerText = `Level: ${level}`;
      document.getElementById('displayScore').innerText = "Score: 0";

      showQuestion();

      modal.classList.remove("hidden-eas");
    }




    // --------------------
    // DISPLAY QUESTION
    // --------------------

    function showQuestion() {

      answered = false;

      document.getElementById("displayQuestion").innerText =
        questions[currentQuestion].question;

      document.getElementById("displayOptionsA").innerText =
        "A. " + questions[currentQuestion].options[0];

      document.getElementById("displayOptionsB").innerText =
        "B. " + questions[currentQuestion].options[1];

      document.getElementById("displayOptionsC").innerText =
        "C. " + questions[currentQuestion].options[2];

      document.getElementById("displayOptionsD").innerText =
        "D. " + questions[currentQuestion].options[3];

      document.getElementById("answerEas").value = "";

      document.getElementById("displayAnswer").innerText = "";
    }



    // --------------------
    // SUBMIT
    // --------------------

    document.getElementById("submitBtn").addEventListener("click", () => {

      if (answered) return;

      const userAnswer = document
        .getElementById("answerEas")
        .value
        .trim()
        .toUpperCase();

      const choices = ["A", "B", "C", "D"];

      const correctAnswer = choices[questions[currentQuestion].answer];

      const result = document.getElementById("displayAnswer");

      let displayScore = document.getElementById('displayScore');


      if (userAnswer === correctAnswer) {

        result.innerText = "✅ Correct!";
        result.style.color = "green";
        score++;
        displayScore.innerText = `Score: ${score}`;

      } else {

        result.innerText = `❌ Wrong! Correct answer is ${correctAnswer}`;
        result.style.color = "red";

      }


      answered = true;

    });


    // --------------------
    // NEXT
    // --------------------

    document.getElementById("nextBtn").addEventListener("click", () => {

      currentQuestion++;

      if (currentQuestion >= questions.length) {

        alert("Quiz Finished!");

        currentQuestion = 0;

      }

      showQuestion();

    });




  </script>


</body>

</html>
